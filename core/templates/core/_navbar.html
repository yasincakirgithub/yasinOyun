{% load static %}
<a class="skip-link" href="#main">İçeriğe geç</a>
<header class="site-nav" data-site-nav>
    <div class="site-nav-inner">
        <a class="site-nav-brand" href="{% url 'core:home' %}" aria-label="Oyun Dünyası ana sayfa">
            <span class="site-nav-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 2.8 20.2 7.4v9.2L12 21.2 3.8 16.6V7.4L12 2.8Z" stroke="#fff" stroke-opacity=".92" stroke-width="1.5"/>
                    <path d="M12 7.2v9.6M7.8 9.6l8.4 4.8M16.2 9.6l-8.4 4.8" stroke="#7ff0ff" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="site-nav-name">Oyun <span>Dünyası</span></span>
        </a>

        <button class="site-nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false" aria-controls="site-nav-links">
            <svg class="icon-menu" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>

        <nav class="site-nav-links" id="site-nav-links" aria-label="Ana menü">
            <a href="{% url 'core:home' %}"{% if request.path == '/' %} aria-current="page"{% endif %}>Anasayfa</a>
            <a href="{% url 'core:games' %}"{% if request.path != '/' and '/admin/' not in request.path %} aria-current="page"{% endif %}>Oyunlar</a>
            <a href="{% url 'core:home' %}#nasil-oynanir">Nasıl Oynanır</a>
            <a class="nav-cta" href="{% url 'core:games' %}">
                Oynamaya Başla
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </nav>

        <div class="nav-gold" data-nav-gold aria-label="Anlık altın fiyatı">
            <span class="nav-gold-label">Altın</span>
            <span class="nav-gold-value" id="nav-gold-value">--</span>
            <span class="nav-gold-unit" id="nav-gold-unit">TL / gram</span>
            <span class="nav-gold-change" id="nav-gold-change"></span>
        </div>
    </div>
</header>
<script>
    (function () {
        var nav = document.querySelector('[data-site-nav]');
        if (!nav) return;

        var toggle = nav.querySelector('.site-nav-toggle');
        var links = nav.querySelector('.site-nav-links');
        var path = window.location.pathname.replace(/\/+$/, '') || '/';

        function setMenu(open) {
            nav.classList.toggle('is-open', open);
            if (toggle) {
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                toggle.setAttribute('aria-label', open ? 'Menüyü kapat' : 'Menüyü aç');
            }
        }

        if (toggle && links) {
            toggle.addEventListener('click', function () {
                setMenu(!nav.classList.contains('is-open'));
            });
            links.querySelectorAll('a').forEach(function (link) {
                link.addEventListener('click', function () { setMenu(false); });
            });
            document.addEventListener('click', function (event) {
                if (!nav.contains(event.target)) setMenu(false);
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    setMenu(false);
                    toggle.focus();
                }
            });
            window.addEventListener('resize', function () {
                if (window.innerWidth > 880) setMenu(false);
            });
        }

        nav.querySelectorAll('.site-nav-links a:not(.nav-cta)').forEach(function (link) {
            var href = link.getAttribute('href') || '';
            if (!href || href.indexOf('#') !== -1) return;
            var target = new URL(href, window.location.origin).pathname.replace(/\/+$/, '') || '/';
            var isActive;
            if (target === '/') {
                isActive = path === '/';
            } else if (target === '/oyunlar') {
                isActive = path !== '/' && path.indexOf('/admin') !== 0;
            } else {
                isActive = path === target || path.indexOf(target + '/') === 0;
            }
            if (isActive) {
                link.setAttribute('aria-current', 'page');
            } else {
                link.removeAttribute('aria-current');
            }
        });

        var updateShadow = function () {
            nav.classList.toggle('is-scrolled', window.scrollY > 8);
        };
        window.addEventListener('scroll', updateShadow, { passive: true });
        updateShadow();
    })();
</script>

<script>
    (function () {
        var valueEl = document.getElementById('nav-gold-value');
        var changeEl = document.getElementById('nav-gold-change');
        var widget = document.querySelector('[data-nav-gold]');
        if (!valueEl || !widget) return;

        var endpoint = '{% url "core:gold_price" %}';
        var lastChangeClass = null;

        function setChange(direction) {
            if (!changeEl) return;
            changeEl.classList.remove('is-up', 'is-down', 'is-neutral');
            if (direction) {
                changeEl.classList.add('is-' + direction);
            }
            var labels = { up: '▲', down: '▼', neutral: '' };
            changeEl.textContent = labels[direction] || '';
        }

        function renderError() {
            valueEl.textContent = '--';
            setChange('neutral');
        }

        function fetchGold() {
            fetch(endpoint, { credentials: 'same-origin' })
                .then(function (response) {
                    if (!response.ok) throw new Error('Sunucu hatası');
                    return response.json();
                })
                .then(function (data) {
                    if (!data || !data.success) {
                        renderError();
                        return;
                    }
                    valueEl.textContent = data.value.toLocaleString('tr-TR', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2,
                    });
                    setChange(data.change || 'neutral');
                })
                .catch(renderError);
        }

        fetchGold();
        setInterval(fetchGold, 60000);
    })();
</script>
