{% load static static_version %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasayfa</title>
    <link rel="icon" type="image/png" href="{% static_v 'core/img/favicon.png' %}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0b0f19;
            --bg-card: #151a28;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #6366f1; /* İndigo / Mor */
            --primary-hover: #4f46e5;
            --accent: #06b6d4; /* Neon Mavi */
            --border-color: #1e293b;
        }

        * { 
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-main);
            /* Arka plan görseli + koyu katman ve hafif parlaklık */
            background-image:
                radial-gradient(circle at top, rgba(30, 27, 75, 0.65) 0%, rgba(11, 15, 25, 0.92) 55%),
                url('{% static "core/img/background.png" %}');
            background-size: cover, cover;
            background-position: center, center;
            background-repeat: no-repeat, no-repeat;
            background-attachment: fixed;
        }

        .site-banner {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(99, 102, 241, 0.25);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(6, 182, 212, 0.1);
        }

        .wrap {
            width: min(1000px, 100%);
            padding: 20px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 18px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
        }

        /* Kartın üzerine gelindiğinde oluşan neon parıltı efekti */
        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.15), 
                        0 0 15px rgba(99, 102, 241, 0.1);
        }

        /* Kart görseli: kenardan kenara */
        .game-card-image {
            display: block;
            width: calc(100% + 28px);
            margin: -14px -14px 0;
            aspect-ratio: 16 / 7;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.35s ease;
        }

        .game-card:hover .game-card-image {
            transform: scale(1.05);
        }

        .tag {
            align-self: flex-start;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent);
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .game-card h2 { 
            margin: 0; 
            font-size: 18px; 
            font-weight: 600;
            color: #ffffff;
        }

        .game-card p { 
            margin: 0; 
            font-size: 13px; 
            line-height: 1.5; 
            color: var(--text-muted); 
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .play {
            margin-top: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: flex-start;
            padding: 8px 14px;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 12.5px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .game-card:hover .play {
            background: var(--primary-hover);
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    {% include 'core/_navbar.html' %}
    <div class="wrap">
        <img class="site-banner" src="{% static_v 'core/img/banner.png' %}"
             alt="Yasincakir.com.tr — Oyun ve Eğlence Dünyası">

        <div class="games" id="oyunlar">
            {% for game in games %}
            <a class="game-card" href="{% url game.url_name %}">
                {% if game.image %}
                <img class="game-card-image" src="{% static_v game.image %}" alt="{{ game.title }}" loading="lazy">
                {% endif %}
                <span class="tag">{{ game.tag }}</span>
                <h2>{{ game.title }}</h2>
                <p>{{ game.description }}</p>
                <span class="play">Oyuna Başla &rarr;</span>
            </a>
            {% endfor %}
        </div>

        <div class="footer">&copy; 2026 Yasin Çakır</div>
    </div>
</body>
</html>
