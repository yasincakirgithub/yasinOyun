{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çok Oyunculu Oyunlar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0b0f19;
            --bg-card: #151a28;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #6366f1; /* İndigo / Mor */
            --primary-hover: #4f46e5;
            --accent: #06b6d4; /* Neon Mavi */
            --border-color: #1e293b;
        }

        * { 
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-main);
            /* Hafif parlak bir arka plan efekti */
            background-image: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-main) 50%);
            background-attachment: fixed;
        }

        .wrap {
            width: min(1000px, 100%);
            padding: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(32px, 6vw, 52px);
            text-align: center;
            font-weight: 700;
            /* Başlığa gradient renk efekti */
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
        }

        .sub {
            margin: 0 0 45px;
            text-align: center;
            font-size: 18px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 30px 26px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* Kartın üzerine gelindiğinde oluşan neon parıltı efekti */
        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.15), 
                        0 0 15px rgba(99, 102, 241, 0.1);
        }

        .tag {
            align-self: flex-start;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .game-card h2 { 
            margin: 0; 
            font-size: 24px; 
            font-weight: 600;
            color: #ffffff;
        }

        .game-card p { 
            margin: 0; 
            font-size: 15px; 
            line-height: 1.6; 
            color: var(--text-muted); 
            flex-grow: 1;
        }

        .play {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: flex-start;
            padding: 12px 24px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .game-card:hover .play {
            background: var(--primary-hover);
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Çok Oyunculu Oyunlar</h1>
        <p class="sub">Birlikte oynamak istediğiniz oyunu seçin.</p>

        <div class="games">
            {% for game in games %}
            <a class="game-card" href="{% url game.url_name %}">
                <span class="tag">{{ game.tag }}</span>
                <h2>{{ game.title }}</h2>
                <p>{{ game.description }}</p>
                <span class="play">Oyuna Başla &rarr;</span>
            </a>
            {% endfor %}
        </div>

        <div class="footer">&copy; 2026 Çok Oyunculu Oyunlar Platformu</div>
    </div>
</body>
</html>
