<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Bilardo masası, toplar ve isteka">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset=".48" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".2" cy=".1" r=".7">
      <stop offset="0" stop-color="#7c5cfc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c5cfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".86" cy=".85" r=".7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b4f2a"/>
      <stop offset=".18" stop-color="#5b321b"/>
      <stop offset=".55" stop-color="#3d2112"/>
      <stop offset="1" stop-color="#24130b"/>
    </linearGradient>
    <linearGradient id="railSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a160d"/>
      <stop offset=".5" stop-color="#6b3d22"/>
      <stop offset="1" stop-color="#2a160d"/>
    </linearGradient>
    <radialGradient id="felt" cx=".5" cy=".42" r=".78">
      <stop offset="0" stop-color="#1c8c68"/>
      <stop offset=".62" stop-color="#116b52"/>
      <stop offset="1" stop-color="#0a4b3b"/>
    </radialGradient>
    <linearGradient id="feltLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="ballWhite" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#e8edf5"/>
      <stop offset="1" stop-color="#9aa7ba"/>
    </radialGradient>
    <radialGradient id="ballRed" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#ff9b8f"/>
      <stop offset=".45" stop-color="#eb5757"/>
      <stop offset="1" stop-color="#8c2020"/>
    </radialGradient>
    <radialGradient id="ballYellow" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#fff3a8"/>
      <stop offset=".45" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#9a6a06"/>
    </radialGradient>
    <radialGradient id="ballBlue" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#9cc4ff"/>
      <stop offset=".45" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#123f7a"/>
    </radialGradient>
    <radialGradient id="ballBlack" cx=".34" cy=".28" r=".78">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset=".45" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="cue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset=".06" stop-color="#7dd3fc"/>
      <stop offset=".12" stop-color="#d9b06b"/>
      <stop offset=".5" stop-color="#9a6a35"/>
      <stop offset="1" stop-color="#3a2110"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".65"/>
    </filter>
    <filter id="ballShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#001a13" flood-opacity=".8"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <!-- arka plan çizgileri -->
  <g opacity=".16" stroke="#9fb3d1">
    <path d="M0 160h1600M0 740h1600" stroke-width="1"/>
    <path d="M120 0v900M1480 0v900" stroke-width="1"/>
  </g>

  <!-- masa -->
  <g filter="url(#shadow)">
    <rect x="150" y="200" width="1300" height="660" rx="46" fill="url(#rail)"/>
    <rect x="150" y="200" width="1300" height="660" rx="46" fill="none" stroke="#b77745" stroke-opacity=".35" stroke-width="2"/>
    <rect x="190" y="240" width="1220" height="580" rx="26" fill="url(#railSide)"/>
    <rect x="226" y="276" width="1148" height="508" rx="14" fill="url(#felt)"/>
    <rect x="226" y="276" width="1148" height="508" rx="14" fill="url(#feltLight)"/>
  </g>

  <!-- bant noktaları -->
  <g fill="#f3d7b1" opacity=".75">
    <circle cx="370" cy="232" r="5"/><circle cx="513" cy="232" r="5"/><circle cx="657" cy="232" r="5"/>
    <circle cx="943" cy="232" r="5"/><circle cx="1087" cy="232" r="5"/><circle cx="1230" cy="232" r="5"/>
    <circle cx="370" cy="828" r="5"/><circle cx="513" cy="828" r="5"/><circle cx="657" cy="828" r="5"/>
    <circle cx="943" cy="828" r="5"/><circle cx="1087" cy="828" r="5"/><circle cx="1230" cy="828" r="5"/>
    <circle cx="182" cy="404" r="5"/><circle cx="182" cy="530" r="5"/><circle cx="182" cy="656" r="5"/>
    <circle cx="1418" cy="404" r="5"/><circle cx="1418" cy="530" r="5"/><circle cx="1418" cy="656" r="5"/>
  </g>

  <!-- delikler -->
  <g fill="#04120e">
    <circle cx="226" cy="276" r="27"/><circle cx="800" cy="276" r="25"/><circle cx="1374" cy="276" r="27"/>
    <circle cx="226" cy="784" r="27"/><circle cx="800" cy="784" r="25"/><circle cx="1374" cy="784" r="27"/>
  </g>
  <g fill="none" stroke="#d7a86e" stroke-opacity=".45" stroke-width="3">
    <circle cx="226" cy="276" r="27"/><circle cx="800" cy="276" r="25"/><circle cx="1374" cy="276" r="27"/>
    <circle cx="226" cy="784" r="27"/><circle cx="800" cy="784" r="25"/><circle cx="1374" cy="784" r="27"/>
  </g>

  <!-- başlangıç çizgisi ve noktalar -->
  <g opacity=".35" stroke="#d9f7ec" fill="#d9f7ec">
    <path d="M516 292v476" stroke-width="2" stroke-dasharray="7 10"/>
    <circle cx="516" cy="530" r="5"/>
    <circle cx="1057" cy="530" r="6"/>
  </g>

  <!-- üçgen rack -->
  <g opacity=".22" stroke="#eafff7" fill="none" stroke-width="2">
    <path d="M1082 424l88 152h-176z"/>
  </g>

  <!-- toplar -->
  <g filter="url(#ballShadow)">
    <circle cx="470" cy="604" r="42" fill="url(#ballWhite)"/>
    <circle cx="470" cy="604" r="42" fill="none" stroke="#fff" stroke-opacity=".55"/>
    <circle cx="470" cy="604" r="7" fill="#e14b4b"/>

    <circle cx="1018" cy="474" r="42" fill="url(#ballYellow)"/>
    <circle cx="1018" cy="474" r="42" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="1018" cy="474" r="22" fill="#fff" opacity=".92"/>
    <text x="1018" y="483" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#16202f">1</text>

    <circle cx="1112" cy="556" r="42" fill="url(#ballRed)"/>
    <circle cx="1112" cy="556" r="42" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="1112" cy="556" r="22" fill="#fff" opacity=".92"/>
    <text x="1112" y="565" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#16202f">3</text>

    <circle cx="1120" cy="382" r="42" fill="url(#ballBlue)"/>
    <circle cx="1120" cy="382" r="42" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="1120" cy="382" r="22" fill="#fff" opacity=".92"/>
    <text x="1120" y="391" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#16202f">2</text>

    <circle cx="1208" cy="466" r="42" fill="url(#ballBlack)"/>
    <circle cx="1208" cy="466" r="42" fill="none" stroke="#fff" stroke-opacity=".25"/>
    <circle cx="1208" cy="466" r="22" fill="#fff" opacity=".92"/>
    <text x="1208" y="475" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#16202f">8</text>

    <circle cx="1112" cy="640" r="42" fill="url(#ballYellow)"/>
    <circle cx="1112" cy="640" r="42" fill="none" stroke="#fff" stroke-opacity=".3"/>
    <circle cx="1112" cy="640" r="22" fill="#fff" opacity=".92"/>
    <text x="1112" y="649" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#16202f">9</text>
  </g>

  <!-- isteka -->
  <g transform="rotate(-24 700 610)" filter="url(#shadow)">
    <rect x="84" y="598" width="720" height="18" rx="9" fill="url(#cue)"/>
    <rect x="84" y="598" width="120" height="18" rx="9" fill="#0b1220" opacity=".28"/>
    <rect x="792" y="596" width="38" height="22" rx="5" fill="#dff5ff"/>
    <rect x="826" y="600" width="14" height="14" rx="3" fill="#22d3ee"/>
    <circle cx="840" cy="607" r="15" fill="#67e8f9" opacity=".25" filter="url(#softGlow)"/>
  </g>

  <!-- vurgu çizgileri -->
  <g opacity=".5">
    <path d="M180 128h340" stroke="#7c5cfc" stroke-width="3" stroke-linecap="round"/>
    <path d="M180 148h190" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>
  <g opacity=".25" fill="none" stroke="#22d3ee">
    <circle cx="1440" cy="130" r="62" stroke-width="2"/>
    <circle cx="1440" cy="130" r="34" stroke-width="2"/>
  </g>
</svg>
