<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sayı Tahmin Oyunu</title>
  <desc id="desc">Koyu lacivert zeminde dört gizli rakam taşı ve artı/eksi geri bildirim işaretleri.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101728"/>
      <stop offset=".55" stop-color="#151d30"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26314b"/>
      <stop offset="1" stop-color="#1a2338"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cfc"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#7c5cfc" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7c5cfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".7"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0v52" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="600" cy="330" rx="430" ry="270" fill="url(#glow)"/>
  <ellipse cx="850" cy="190" rx="210" ry="160" fill="url(#glow2)"/>

  <g opacity=".5">
    <circle cx="187" cy="168" r="3" fill="#22d3ee"/>
    <circle cx="1010" cy="408" r="2.5" fill="#a78bfa"/>
    <circle cx="933" cy="126" r="2" fill="#94a3b8"/>
    <circle cx="265" cy="501" r="2" fill="#7c5cfc"/>
  </g>

  <g transform="translate(600 330)">
    <g transform="rotate(-13) translate(-262 -107)" filter="url(#shadow)">
      <rect width="164" height="214" rx="26" fill="url(#tile)" stroke="#94a3b8" stroke-opacity=".22" stroke-width="2"/>
      <rect x="10" y="10" width="144" height="194" rx="19" fill="none" stroke="#f8fafc" stroke-opacity=".05"/>
      <text x="82" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="104" font-weight="700" fill="url(#violet)" text-anchor="middle">7</text>
    </g>

    <g transform="rotate(-4) translate(-117 -128)" filter="url(#shadow)">
      <rect width="174" height="228" rx="27" fill="url(#tile)" stroke="#94a3b8" stroke-opacity=".26" stroke-width="2"/>
      <rect x="10" y="10" width="154" height="208" rx="20" fill="none" stroke="#f8fafc" stroke-opacity=".06"/>
      <text x="87" y="155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="112" font-weight="700" fill="#f8fafc" text-anchor="middle">4</text>
    </g>

    <g transform="rotate(6) translate(43 -121)" filter="url(#shadow)">
      <rect width="174" height="228" rx="27" fill="url(#tile)" stroke="#94a3b8" stroke-opacity=".26" stroke-width="2"/>
      <rect x="10" y="10" width="154" height="208" rx="20" fill="none" stroke="#f8fafc" stroke-opacity=".06"/>
      <text x="87" y="155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="112" font-weight="700" fill="#f8fafc" text-anchor="middle">1</text>
    </g>

    <g transform="rotate(15) translate(204 -96)" filter="url(#shadow)">
      <rect width="164" height="214" rx="26" fill="url(#tile)" stroke="#94a3b8" stroke-opacity=".22" stroke-width="2"/>
      <rect x="10" y="10" width="144" height="194" rx="19" fill="none" stroke="#f8fafc" stroke-opacity=".05"/>
      <text x="82" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="104" font-weight="700" fill="url(#cyan)" text-anchor="middle">9</text>
    </g>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">
    <g transform="translate(388 552)">
      <rect width="122" height="50" rx="25" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".4" stroke-width="1.5"/>
      <circle cx="27" cy="25" r="9" fill="#22c55e" fill-opacity=".2"/>
      <path d="M23 25h8M27 21v8" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
      <text x="76" y="33" font-size="22" fill="#4ade80" text-anchor="middle">+2</text>
    </g>
    <g transform="translate(690 552)">
      <rect width="122" height="50" rx="25" fill="#ef4444" fill-opacity=".1" stroke="#ef4444" stroke-opacity=".35" stroke-width="1.5"/>
      <circle cx="27" cy="25" r="9" fill="#ef4444" fill-opacity=".18"/>
      <path d="M23 25h8" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
      <text x="76" y="33" font-size="22" fill="#f87171" text-anchor="middle">−1</text>
    </g>
  </g>

  <g opacity=".22" filter="url(#soft)">
    <circle cx="600" cy="610" r="120" fill="#7c5cfc"/>
  </g>
</svg>
