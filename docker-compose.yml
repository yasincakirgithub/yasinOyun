# Unified games platform.
#
# One Django project hosts both games in the same container/port.
# PostgreSQL runs on AWS RDS (not in Docker); Redis runs here for WebSockets.
#
#   docker compose up -d --build
#
# Then open:
#   http://<host>:8000/          -> game selector (landing page)
#   http://<host>:8000/sayi/     -> number guessing game
#   http://<host>:8000/kim-bu/   -> "Kim Bu?" character guessing game
#
# The database named by DB_NAME (default: `oyunlar`) is created automatically
# on the RDS instance by the `web` container at startup (ensure_db.py), using
# the maintenance `postgres` database.
#
# Requirements on AWS: the RDS security group must allow inbound TCP 5432 from
# this host (security group / IP), and the RDS instance must be reachable from
# here (same VPC, or publicly accessible).

services:
  web:
    build: .
    command: >
      sh -c "python ensure_db.py &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach the shared Redis on the host (WebSockets).
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
