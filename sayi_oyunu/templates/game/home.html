{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yazayno - number app</title>
    <link rel="stylesheet" href="{% static 'css/game.css' %}">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>yazayno - number app</h1>
            <p>A modern take on the classic paper-and-pencil number guessing game</p>
        </div>

        <div class="home-content">
            <div class="game-card">
                <h2>Create Game</h2>
                <p>Create a new game room and share the code with your opponent</p>
                <button id="create-btn" class="game-btn">CREATE GAME</button>
            </div>

            <div class="game-card">
                <h2>Join Game</h2>
                <p>Enter a room code to join an existing game</p>
                <input type="text" id="room-code-input" maxlength="6" placeholder="Room Code" autocomplete="off">
                <button id="join-btn" class="game-btn">JOIN GAME</button>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 yazayno - number app</p>
        </div>
    </div>

    <script src="{% static 'js/home.js' %}"></script>
</body>
</html>
