<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>yazayno - number app</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {font-family: Arial, sans-serif; background:#f0f0f0; margin:0; padding:20px; display:flex; justify-content:center;}
        .container {background:#fff; padding:30px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); width:320px;}
        h1 {text-align:center; color:#333;}
        .info {margin:15px 0; font-size:14px; color:#555;}
        input {width:calc(100% - 20px); padding:8px; margin-top:5px; font-size:16px;}
        button {width:100%; padding:10px; margin-top:10px; font-size:16px; background:#4CAF50; color:#fff; border:none; border-radius:4px; cursor:pointer;}
        button:disabled {background:#ccc; cursor:not-allowed;}
        .log {margin-top:20px; height:150px; overflow-y:auto; border:1px solid #ddd; padding:10px; background:#fafafa;}
        .log div {margin:4px 0; font-family:monospace;}
        .turn {font-weight:bold; color:#2E8B57;}
    </style>
</head>
<body>
<div class="container">
    <h1>yazayno - number app</h1>
    <div id="status" class="info">Bağlantı bekleniyor...</div>
    <div>
        Oda Kodu: <input type="text" id="room" placeholder="Oda kodu girin" maxlength="6">
        <button id="joinBtn">Katıl</button>
    </div>
    <div id="gameArea" style="display:none;">
        <div class="info">Sıra: <span id="turnInfo" class="turn">-</span></div>
        <input type="text" id="guessInput" maxlength="4" placeholder="Tahmin (4 basamaklı)">
        <button id="guessBtn">Tahmin Et</button>
        <div class="log" id="log"></div>
    </div>
</div>

<script>
    const socket = io();
    let room = null;
    let mySid = null;
    let opponentSid = null;

    document.getElementById('joinBtn').onclick = () => {
        const r = document.getElementById('room').value.trim();
        if (!r) { alert('Oda kodu girin'); return; }
        room = r;
        socket.emit('join', {room});
    };

    socket.on('waiting', data => {
        document.getElementById('status').innerText = data.msg;
    });

    socket.on('game_start', data => {
        mySid = data.your_sid;
        opponentSid = data.opponent;
        document.getElementById('status').innerText = 'Oyun başladı!';
        document.getElementById('gameArea').style.display = 'block';
        updateTurn(data.turn);
    });

    socket.on('your_turn', data => {
        updateTurn(data.turn);
    });

    socket.on('guess_result', data => {
        const log = document.getElementById('log');
        const entry = document.createElement('div');
        entry.textContent = `${data.guesser === mySid ? 'Siz' : 'Rakip'} tahmin: ${data.guess} → Sonuç: ${data.result}`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
    });

    socket.on('game_over', data => {
        const log = document.getElementById('log');
        const msg = document.createElement('div');
        msg.style.color = data.winner === mySid ? 'green' : 'red';
        msg.textContent = data.winner === mySid ? 'Kazandınız!' : 'Kaybettiniz.';
        log.appendChild(msg);
        document.getElementById('guessInput').disabled = true;
        document.getElementById('guessBtn').disabled = true;
    });

    socket.on('error', data => {
        alert(data.msg);
    });

    document.getElementById('guessBtn').onclick = () => {
        const guess = document.getElementById('guessInput').value.trim();
        if (!/^\d{4}$/.test(guess)) { alert('4 basamaklı sayı girin'); return; }
        socket.emit('guess', {room, guess});
        document.getElementById('guessInput').value = '';
    };

    function updateTurn(turnSid) {
        const turnInfo = document.getElementById('turnInfo');
        if (turnSid === mySid) {
            turnInfo.textContent = 'Sizin';
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessBtn').disabled = false;
        } else {
            turnInfo.textContent = 'Rakip';
            document.getElementById('guessInput').disabled = true;
            document.getElementById('guessBtn').disabled = true;
        }
    }
</script>
</body>
</html>
