# Single-EC2 deployment.
#
# PostgreSQL and Redis are assumed to be ALREADY running on the host, started
# from the top-level ../docker-compose.yml. This stack does NOT start database
# or cache containers; it connects to the existing servers and uses the `kimbu`
# database. Create that database once with:
#
#   docker compose --profile init run --rm db-init
#
# then start the app:
#
#   docker compose up -d --build

services:
  web:
    build: .
    command: >
      sh -c "python ensure_db.py &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8001"
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach the shared PostgreSQL and Redis on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # One-shot helper that creates the `kimbu` database inside the shared
  # PostgreSQL server. Run it explicitly with the `init` profile.
  db-init:
    image: postgres:15-alpine
    profiles: ["init"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export PGPASSWORD="$${DB_PASSWORD}"
        if psql -h "$${DB_HOST}" -p "$${DB_PORT}" -U "$${DB_USER}" -d postgres \
             -tAc "SELECT 1 FROM pg_database WHERE datname='$${DB_NAME}'" | grep -q 1; then
          echo "Veritabani '$${DB_NAME}' zaten mevcut."
        else
          psql -h "$${DB_HOST}" -p "$${DB_PORT}" -U "$${DB_USER}" -d postgres \
            -c "CREATE DATABASE \"$${DB_NAME}\" OWNER \"$${DB_USER}\";" \
            && echo "Veritabani '$${DB_NAME}' olusturuldu."
        fi
