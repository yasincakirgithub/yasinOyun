{% load static static_version %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satranç - Online İki Kişilik</title>
    <link rel="stylesheet" href="{% static_v 'core/css/home.css' %}">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Satranç</h1>
            <p>Rakibinle ya da Stockfish botuna karşı oyna. Modu, taş rengini ve süreyi sen seç.</p>
        </div>

        <div class="name-card">
            <label for="player-name-input">Oyuncu Adı</label>
            <input type="text" id="player-name-input" maxlength="20" placeholder="Adın" autocomplete="off">
        </div>

        <div class="setup-card">
            <div class="mode-tabs" id="mode-tabs">
                <button type="button" class="mode-tab selected" data-mode="human">Rakiple Oyna</button>
                <button type="button" class="mode-tab" data-mode="bot">Bota Karşı Oyna</button>
            </div>

            <div class="setup-row">
                <span class="setup-label">Süre</span>
                <div class="choice-group" id="time-choices">
                    {% for tc in time_controls %}
                    <button type="button"
                            class="choice-chip{% if tc.value == default_time_control and tc.increment == default_increment %} selected{% endif %}"
                            data-time="{{ tc.value }}"
                            data-increment="{{ tc.increment }}">{{ tc.label }}</button>
                    {% endfor %}
                </div>
            </div>

            <div class="mode-panel" id="mode-human">
                <button id="create-btn" class="game-btn" type="button">ODA KUR</button>

                <div class="divider"><span>veya</span></div>

                <div class="join-row">
                    <input type="text" id="room-code-input" maxlength="6" placeholder="Oda Kodu" autocomplete="off">
                    <button id="join-btn" class="game-btn accent" type="button">KATIL</button>
                </div>
            </div>

            <div class="mode-panel hidden" id="mode-bot">
                <div class="setup-row">
                    <label class="setup-label" for="bot-level">Seviye</label>
                    <select id="bot-level">
                        {% for level in bot_levels %}
                        <option value="{{ level.level }}" {% if level.level == default_bot_level %}selected{% endif %}>
                            Sv.{{ level.level }} — {{ level.name }} ({{ level.elo }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="setup-row">
                    <span class="setup-label">Taş rengin</span>
                    <div class="choice-group" id="color-choices">
                        <button type="button" class="choice-chip selected" data-color="w">Beyaz</button>
                        <button type="button" class="choice-chip" data-color="b">Siyah</button>
                        <button type="button" class="choice-chip" data-color="random">Rastgele</button>
                    </div>
                </div>

                <button id="create-bot-btn" class="game-btn" type="button">BOTA KARŞI OYNA</button>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Satranç — İki kişilik strateji oyunu</p>
        </div>
    </div>

    <script src="{% static_v 'satranc/js/home.js' %}"></script>
</body>
</html>
